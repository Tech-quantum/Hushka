name: Build Hushka APK
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

# برای انتشار APK در Release عمومی لازم است
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify voice models are real archives (not Git-LFS pointers)
        run: python3 check_voice_models.py
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Hushka-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- نسخه‌ی سبک: بدون مدل‌های صوتی (برای دانلود سریع و تست UI) ----
      - name: Build lite debug APK (voice models excluded)
        run: |
          set -euo pipefail
          mkdir -p build/full build/lite
          cp app/build/outputs/apk/debug/app-debug.apk build/full/app-debug.apk
          rm -f app/src/main/assets/vosk-model-*.zip
          # بسته‌بندی افزایشی AGP مدل‌های حذف‌شده را فقط از central directory
          # برمی‌دارد و بایت‌هایشان را به‌صورت زباله داخل فایل نگه می‌دارد؛
          # نتیجه، یک «APK سبک» ۲۷۴ مگابایتی بود که نصبش هم شکست می‌خورد.
          # کش بسته‌بندی را پاک می‌کنیم تا APK از صفر نوشته شود.
          rm -rf app/build/intermediates/assets \
                 app/build/intermediates/merged_assets \
                 app/build/outputs/apk/debug
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk build/lite/app-debug-lite.apk
          FULL=$(stat -c%s build/full/app-debug.apk)
          LITE=$(stat -c%s build/lite/app-debug-lite.apk)
          echo "full=${FULL} bytes / lite=${LITE} bytes"
          if unzip -l build/lite/app-debug-lite.apk | grep -q "vosk-model"; then
            echo "voice models are still packaged into the lite APK"
            exit 1
          fi
          # اگر Gradle کش کرده باشد و APK سبک ساخته نشود، بیلد باید شکست بخورد
          [ "${LITE}" -lt "${FULL}" ] || { echo "lite APK is not smaller than full APK"; exit 1; }
          # مدل‌ها ~۲۲۸ مگابایت‌اند؛ نسخه‌ی سبک باید واقعاً زیر ۱۰۰ مگابایت باشد
          [ "${LITE}" -lt 100000000 ] || { echo "lite APK is unexpectedly large: ${LITE} bytes"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Hushka-debug-apk-lite
          path: build/lite/app-debug-lite.apk
          if-no-files-found: error

      # ---- APK برای دانلود عمومی و قابل ادامه (Resume) ----
      - name: Prepare checksums and split parts
        run: |
          set -euo pipefail
          (cd build/full && sha256sum app-debug.apk > ../app-debug.apk.sha256)
          (cd build/lite && sha256sum app-debug-lite.apk > ../app-debug-lite.apk.sha256)
          cat build/app-debug.apk.sha256 build/app-debug-lite.apk.sha256
          # تکه‌های ۴۸ مگابایتی فقط برای نسخه‌ی کامل
          mkdir -p build/apk-parts
          split -b 48M -d -a 2 build/full/app-debug.apk build/apk-parts/apk.part-
          (cd build/apk-parts && sha256sum apk.part-* > ../apk-parts.sha256)
          ls -l build/lite build/apk-parts

      - name: Publish test build to GitHub Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HASH_FULL=$(cut -d' ' -f1 build/app-debug.apk.sha256)
          HASH_LITE=$(cut -d' ' -f1 build/app-debug-lite.apk.sha256)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/test-latest"
          {
            echo "Test build from \`main\` at \`${GITHUB_SHA:0:7}\`"
            echo
            echo "### سبک — بدون مدل صوتی (برای تست UI)"
            echo '```'
            echo "curl -L -C - -O ${BASE}/app-debug-lite.apk"
            echo '```'
            echo
            echo "### کامل — با مدل صوتی آفلاین"
            echo '```'
            echo "curl -L -C - -o app-debug.apk ${BASE}/app-debug.apk"
            echo '```'
            echo
            echo "### یا دانلود تکه‌تکه نسخه‌ی کامل (هر تکه ~۴۸ مگابایت)"
            echo '```'
            echo "mkdir -p parts && cd parts"
            echo "for i in 00 01 02 03 04 05 06 07 08 09; do"
            echo "  curl -L -f -C - -O ${BASE}/apk.part-\$i || break"
            echo "done"
            echo "cat apk.part-* > app-debug.apk"
            echo '```'
            echo
            echo "SHA-256 \`app-debug-lite.apk\`:"
            echo '```'
            echo "${HASH_LITE}"
            echo '```'
            echo
            echo "SHA-256 \`app-debug.apk\`:"
            echo '```'
            echo "${HASH_FULL}"
            echo '```'
          } > build/release-notes.md
          gh release delete test-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create test-latest \
            --title "Test APK (main)" \
            --notes-file build/release-notes.md \
            --prerelease \
            build/lite/app-debug-lite.apk \
            build/app-debug-lite.apk.sha256 \
            build/full/app-debug.apk \
            build/app-debug.apk.sha256 \
            build/apk-parts.sha256 \
            build/apk-parts/apk.part-*
